<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>

<body>
  <div class="phone">

    <header>
      <h1 id="location">Weather</h1>
      <p id="condition">—</p>
      <div id="temperature">--°</div>

      <div class="controls">
  <input id="searchInput" placeholder="Area / City / Country" />

  <button id="searchBtn">Search</button>
  <button id="locBtn">My Location</button>

  <!-- ADD THIS -->
  <button id="aiBtn">🤖 AI Weather Insight</button>
</div>

<!-- ADD THIS BELOW controls -->
<div id="aiResult" class="ai-box"></div>
    </header>

    
    <section class="details">
      <div>Humidity <span id="humidity">--</span>%</div>
      <div>Wind <span id="wind">--</span> m/s</div>
    </section>

    <div id="map"></div>

    <p id="status"></p>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
