<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather Glass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app glass">

    <h1 id="location">Weather</h1>
    <p id="condition">—</p>
    <div id="temperature">--°</div>

    <div class="controls">
      <input id="searchInput" placeholder="Area / City / Country" />
      <button id="searchBtn">Search</button>
      <button id="locBtn">My Location</button>
    </div>

    <div class="stats">
      <div>Humidity: <span id="humidity">--</span>%</div>
      <div>Wind: <span id="wind">--</span> m/s</div>
    </div>

    <button id="aiBtn">🤖 AI Weather Insight</button>
     <div id="aiResult" class="ai-box"></div>
    
    <div id="map"></div>

    <h3>7-Day Forecast</h3>
    <div id="forecast"></div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
