<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Glass</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <div class="left">

      <div class="location" id="location">--</div>
      <div class="condition" id="condition">--</div>
      <div class="temperature">
        <span id="temperature">--</span>
        <span id="unit">°C</span>
      </div>

      <div class="search-bar">
        <input id="searchInput" placeholder="Area / City / Country" />
        <button id="searchBtn">Search</button>
        <button id="voiceBtn">🎤</button>
      </div>

      <div class="info">
        <div>Humidity: <span id="humidity">--</span></div>
        <div>Wind: <span id="wind">--</span></div>
      </div>

      <button class="ai-btn" id="aiBtn">🤖 AI Weather Insight</button>
      <div id="aiResult" class="ai-result"></div>

      <div class="toggle">
        <span>°C</span>
        <input type="checkbox" id="unitToggle" />
        <span>°F</span>
      </div>

    </div>

    <div class="right">
      <div id="map"></div>

      <h3>7-Day Forecast</h3>
      <div id="forecast" class="forecast"></div>
    </div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
<!-- Animated Sky Background -->
<video id="skyBg" autoplay muted loop playsinline></video>
